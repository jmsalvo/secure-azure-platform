name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform validate (bootstrap + every stack)
        shell: bash
        run: |
          set -euo pipefail
          for dir in bootstrap environments/dev/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color -lockfile=readonly
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --no-color

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml

  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter falls back to the GitHub API to list changed files
    # (the default shallow checkout can't diff locally) and that call needs
    # pull-requests: read, which the workflow-level `contents: read` above
    # doesn't grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      networking: ${{ steps.filter.outputs.networking }}
      observability: ${{ steps.filter.outputs.observability }}
      key_vault: ${{ steps.filter.outputs.key_vault }}
      aks: ${{ steps.filter.outputs.aks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            networking:
              - 'environments/dev/networking/**'
            observability:
              - 'environments/dev/observability/**'
            key_vault:
              - 'environments/dev/key-vault/**'
            aks:
              - 'environments/dev/aks/**'

  # plan-* / apply_* all share the same terraform wiring — see
  # .github/actions/tf-stack. The stacks take no group-object-id variables
  # (bootstrap/ makes every role assignment); the only per-stack -var is
  # tfstate_storage_account_name, read from backend.hcl inside the action.

  plan-networking:
    if: github.event_name == 'pull_request' && needs.changes.outputs.networking == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: networking
          mode: plan
          terraform-version: ${{ env.TERRAFORM_VERSION }}

  plan-observability:
    if: github.event_name == 'pull_request' && needs.changes.outputs.observability == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: observability
          mode: plan
          terraform-version: ${{ env.TERRAFORM_VERSION }}

  plan-key-vault:
    if: github.event_name == 'pull_request' && needs.changes.outputs.key_vault == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: key-vault
          mode: plan
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          needs-tfstate-storage-account: "true"

  plan-aks:
    if: github.event_name == 'pull_request' && needs.changes.outputs.aks == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: aks
          mode: plan
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          needs-tfstate-storage-account: "true"

  apply_networking:
    # No always() here, deliberately. Every job in needs: below runs
    # unconditionally on a push, so none is ever *skipped* and GitHub's
    # implicit success() gate over the whole needs: list is the whole gate —
    # a failed fmt / validate / tflint / trivy skips this job. If you ever
    # add a *skippable* job to needs: (one with its own if:), you must also
    # add always() AND hand-rolled needs.<job>.result == 'success' checks for
    # fmt / validate / tflint / trivy — see apply_key_vault and commit 02d3842.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.networking == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    environment: dev-apply
    # One apply at a time per stack: two merges to main in quick succession
    # otherwise race for the same state blob. Queue, never cancel — cancelling
    # a running apply mid-flight is how state gets left inconsistent.
    concurrency:
      group: apply-networking
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: networking
          mode: apply
          terraform-version: ${{ env.TERRAFORM_VERSION }}

  apply_observability:
    # No always() here, deliberately — see apply_networking.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.observability == 'true'
    needs: [fmt, validate, tflint, trivy, changes]
    runs-on: ubuntu-latest
    environment: dev-apply
    # See apply_networking: serialise applies against this stack's state.
    concurrency:
      group: apply-observability
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: observability
          mode: apply
          terraform-version: ${{ env.TERRAFORM_VERSION }}

  apply_key_vault:
    # always() is required so this job still runs when apply_networking /
    # apply_observability are *skipped* (that stack unchanged in this push).
    # always() also disables GitHub's implicit success() gate over the whole
    # needs: list, so the fmt / validate / tflint / trivy results are
    # re-checked by hand below — without those explicit checks a failing
    # credential-free check could not block this live terraform apply (the
    # hole fixed in 02d3842). Removing any of the result checks reopens it.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.fmt.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.tflint.result == 'success' &&
      needs.trivy.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.key_vault == 'true' &&
      (needs.apply_networking.result == 'success' || needs.apply_networking.result == 'skipped') &&
      (needs.apply_observability.result == 'success' || needs.apply_observability.result == 'skipped')
    needs: [fmt, validate, tflint, trivy, changes, apply_networking, apply_observability]
    runs-on: ubuntu-latest
    environment: dev-apply
    # See apply_networking: serialise applies against this stack's state.
    concurrency:
      group: apply-key-vault
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: key-vault
          mode: apply
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          needs-tfstate-storage-account: "true"

  apply_aks:
    # always() is required so this job still runs when apply_networking /
    # apply_observability are *skipped* (that stack unchanged in this push).
    # See apply_key_vault for why every fmt/validate/tflint/trivy/changes
    # result is re-checked by hand instead of relying on the implicit
    # needs: gate.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.fmt.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.tflint.result == 'success' &&
      needs.trivy.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.aks == 'true' &&
      (needs.apply_networking.result == 'success' || needs.apply_networking.result == 'skipped') &&
      (needs.apply_observability.result == 'success' || needs.apply_observability.result == 'skipped')
    needs: [fmt, validate, tflint, trivy, changes, apply_networking, apply_observability]
    runs-on: ubuntu-latest
    environment: dev-apply
    # See apply_networking: serialise applies against this stack's state.
    # Also shared with the destroy job's confirm-gated `terraform destroy`
    # for this stack — same concurrency group name.
    concurrency:
      group: apply-aks
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-stack
        with:
          stack: aks
          mode: apply
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          needs-tfstate-storage-account: "true"
